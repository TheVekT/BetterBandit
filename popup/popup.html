<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BetterBandit</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="logo-container">
        <img src="logo-panorama.png" alt="Логотип BetterBandit">
    </div>
    <main>
        <div class="wrapper">
        <div class="content">
        <div class="switch-div">
            <p class="hide-bal-text">Hide your balance</p>
            <label class="switch">
                <input type="checkbox" id="toggleBalanceHiding">
                <span class="slider round"></span>
            </label>
        </div>
        <div class="switch-div">
          <p class="BetterAutoBet-text">Better Autobets</p>
          <label class="switch" id="betterAutoBet">
              <input type="checkbox" id="toggler">
              <span class="slider round"></span>
          </label>
        </div>
        </div>
        </div>
    </main>
  <footer>
    <p class="created-by">Created by TheVekT</p>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
